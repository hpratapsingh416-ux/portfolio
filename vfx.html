<!-- vfx.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VFX & Compositing</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0b0f19;
      color:white;
    }

    header{
      padding:30px 10%;
      text-align:center;
      background:#111827;
    }

    header h1{
      font-size:45px;
      color:#00c3ff;
    }

    header p{
      margin-top:10px;
      color:#d1d5db;
    }

    .video-section{
      padding:60px 10%;
    }

    .video-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
      gap:35px;
    }

    .video-card{
      background:#1f2937;
      border-radius:18px;
      overflow:hidden;
      transition:0.4s;
    }

    .video-card:hover{
      transform:translateY(-8px);
    }

    video{
      width:100%;
      height:350px;
      object-fit:cover;
      background:black;
    }

    .video-content{
      padding:20px;
    }

    .video-content h3{
      margin-bottom:12px;
      font-size:24px;
    }

    .video-content p{
      color:#d1d5db;
      line-height:1.7;
    }

    .back-btn{
      display:inline-block;
      margin-top:50px;
      padding:14px 30px;
      background:linear-gradient(to right,#00c3ff,#005eff);
      color:white;
      text-decoration:none;
      border-radius:40px;
    }

  </style>
</head>

<body>

  <header>
    <h1>VFX & Compositing</h1>
    <p>Visual effects and cinematic compositing projects.</p>
  </header>

  <section class="video-section">

    <div class="video-grid">

      <div class="video-card">
        <video controls>
          <source src="Chromavid.mp4" type="video/mp4">
        </video>

        <div class="video-content">
          <h3>Chroma</h3>
          <p>Green Screen Composite</p>
        </div>
      </div>

      <div class="video-card">
        <video controls>
          <source src="Trackingvid.mp4" type="video/mp4">
        </video>

        <div class="video-content">
          <h3>Camera Tracking</h3>
          <p>3d</p>
        </div>
      </div>

     

    </div>

    <a href="index.html" class="back-btn">
      Back to Portfolio
    </a>

  </section>

</body>
</html>
