<!-- digitalfilm.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Film Making</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0b0f19;
      color:white;
    }

    /* HEADER */

    header{
      padding:40px 10%;
      text-align:center;
      background:#111827;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    header h1{
      font-size:48px;
      color:#00c3ff;
      margin-bottom:10px;
    }

    header p{
      color:#d1d5db;
      font-size:17px;
    }

    /* SECTION */

    .video-section{
      padding:60px 10%;
    }

    /* GRID */

    .video-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
      gap:35px;
      align-items:start;
    }

    /* CARD */

    .video-card{
      background:#1f2937;
      border-radius:20px;
      overflow:hidden;
      transition:0.4s;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .video-card:hover{
      transform:translateY(-8px);
    }

    /* VIDEO */

    .video-card video{
      width:100%;
      height:350px;
      object-fit:cover;
      display:block;
      background:black;
    }

    /* PORTRAIT IMAGE */

    .portrait-link{
      display:block;
      text-decoration:none;
    }

    .portrait-link img{
      width:100%;
      height:350px;
      object-fit:cover;
      display:block;
      transition:0.4s;
      cursor:pointer;
    }

    .portrait-link img:hover{
      transform:scale(1.02);
    }

    /* CONTENT */

    .video-content{
      padding:22px;
    }

    .video-content h3{
      margin-bottom:12px;
      font-size:24px;
    }

    .video-content p{
      color:#d1d5db;
      line-height:1.7;
      font-size:15px;
    }

    /* BUTTON */

    .back-btn{
      display:inline-block;
      margin-top:50px;
      padding:14px 30px;
      background:linear-gradient(to right,#00c3ff,#005eff);
      color:white;
      text-decoration:none;
      border-radius:40px;
      transition:0.4s;
    }

    .back-btn:hover{
      transform:translateY(-4px);
    }

    /* RESPONSIVE */

    @media(max-width:768px){

      header h1{
        font-size:34px;
      }

      .video-grid{
        grid-template-columns:1fr;
      }

      .video-card video{
        height:250px;
      }

      .portrait-link img{
        height:500px;
      }

    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header>

    <h1>Digital Film Making</h1>

    <p>
      Short films and cinematic storytelling projects.
    </p>

  </header>

  <!-- SECTION -->

  <section class="video-section">

    <div class="video-grid">

      <!-- VIDEO -->

      <div class="video-card">

        <video controls>

          <source src="AI Video.mp4" type="video/mp4">

        </video>

        <div class="video-content">

          <h3>AI Film</h3>

          <p>
            Creative storytelling and cinematic visuals.
          </p>

        </div>

      </div>

      <!-- PORTRAIT IMAGE -->

      <div class="video-card">

        <a href="Poster_thestalker.jpeg"
        target="_blank"
        class="portrait-link">

          <img src="Poster_thestalker.jpeg"
          alt="Cinematic Poster">

        </a>

        <div class="video-content">

          <h3>Cinematic Poster</h3>

          <p>
            Shortfilm 
          </p>

        </div>

      </div>

    </div>

    <!-- BACK BUTTON -->

    <a href="index.html" class="back-btn">
      Back to Portfolio
    </a>

  </section>

</body>
</html>
